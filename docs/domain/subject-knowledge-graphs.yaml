version: 1
id_format: subject.domain.node
notes:
  - 图谱只描述能力、前置关系和掌握标准，不复制教材表达。
  - stage 是建议覆盖学段，最终可按年级世界重新编排。
  - prerequisites 使用节点 id，形成可计算的有向无环图。

subjects:
  - id: math
    name: 数学
    domains:
      - id: number_sense
        name: 数与量
        nodes:
          - id: math.number_sense.count_to_20
            name: 20以内认数与数量对应
            stage: g1
            prerequisites: []
            mastery: [能完成数字与数量对应, 能比较20以内数量大小]
            item_families: [识别, 判断, 应用]
            boss_theme: 数字森林
          - id: math.number_sense.place_value
            name: 数位与十进制表示
            stage: g1-g2
            prerequisites: [math.number_sense.count_to_20]
            mastery: [能说出各数位意义, 能完成简单进位退位]
            item_families: [识别, 判断, 计算]
            boss_theme: 数位城
      - id: arithmetic
        name: 四则运算
        nodes:
          - id: math.arithmetic.add_sub_10
            name: 10以内加减法
            stage: g1
            prerequisites: [math.number_sense.count_to_20]
            mastery: [能熟练计算10以内加减, 能用图示解释加减]
            item_families: [计算, 应用, 判断]
            boss_theme: 十格门
          - id: math.arithmetic.add_sub_20
            name: 20以内加减法与进退位
            stage: g1
            prerequisites: [math.arithmetic.add_sub_10, math.number_sense.place_value]
            mastery: [能完成20以内进退位, 能选择简便算法]
            item_families: [计算, 应用, 迁移]
            boss_theme: 进位桥
          - id: math.arithmetic.add_sub_100
            name: 100以内加减法
            stage: g2
            prerequisites: [math.arithmetic.add_sub_20]
            mastery: [能完成两位数加减, 能解决一步实际问题]
            item_families: [计算, 应用, 迁移]
            boss_theme: 百数塔
          - id: math.arithmetic.multiplication_meaning
            name: 乘法意义与重复相加
            stage: g2
            prerequisites: [math.arithmetic.add_sub_100]
            mastery: [能把重复相加写成乘法, 能解释乘法各部分意义]
            item_families: [识别, 建模, 应用]
            boss_theme: 阵列之门
          - id: math.arithmetic.multiplication_table
            name: 99乘法口诀
            stage: g2-g3
            prerequisites: [math.arithmetic.multiplication_meaning]
            mastery: [能熟练调用乘法口诀, 能从口诀反推因数]
            item_families: [计算, 判断, 迁移]
            boss_theme: 九九回廊
          - id: math.arithmetic.division_inverse
            name: 除法、余数与乘除互逆
            stage: g3
            prerequisites: [math.arithmetic.multiplication_table]
            mastery: [能用乘法验算除法, 能理解余数意义]
            item_families: [计算, 应用, 建模]
            boss_theme: 逆流石门
          - id: math.arithmetic.mixed_operations
            name: 四则混合运算与运算顺序
            stage: g3-g4
            prerequisites: [math.arithmetic.division_inverse]
            mastery: [能按顺序计算, 能使用括号改变运算]
            item_families: [计算, 判断, 应用]
            boss_theme: 运算中枢
      - id: fractions_decimals
        name: 分数、小数与比例
        nodes:
          - id: math.fractions_decimals.fraction_meaning
            name: 分数意义与等值分数
            stage: g3-g4
            prerequisites: [math.arithmetic.division_inverse]
            mastery: [能从整体和部分理解分数, 能识别等值分数]
            item_families: [识别, 建模, 判断]
            boss_theme: 分数裂谷
          - id: math.fractions_decimals.fraction_operations
            name: 分数比较与四则运算
            stage: g4-g5
            prerequisites: [math.fractions_decimals.fraction_meaning]
            mastery: [能比较分数大小, 能完成分数基本运算]
            item_families: [计算, 应用, 迁移]
            boss_theme: 分数熔炉
          - id: math.fractions_decimals.decimal_meaning
            name: 小数意义与分数互换
            stage: g4
            prerequisites: [math.fractions_decimals.fraction_meaning]
            mastery: [能理解小数位值, 能完成小数分数互换]
            item_families: [识别, 计算, 判断]
            boss_theme: 小数回廊
          - id: math.fractions_decimals.decimal_operations
            name: 小数四则运算
            stage: g4-g5
            prerequisites: [math.fractions_decimals.decimal_meaning]
            mastery: [能完成小数运算, 能估计结果合理性]
            item_families: [计算, 应用, 迁移]
            boss_theme: 精度之塔
          - id: math.fractions_decimals.ratio_percent
            name: 比、比例与百分数
            stage: g5-g6
            prerequisites: [math.fractions_decimals.fraction_operations, math.fractions_decimals.decimal_operations]
            mastery: [能表示比和比例, 能解决百分数实际问题]
            item_families: [建模, 应用, 迁移]
            boss_theme: 比例天平
      - id: algebra
        name: 代数与方程
        nodes:
          - id: math.algebra.letters_expressions
            name: 用字母表示数与代数式
            stage: g5-g7
            prerequisites: [math.arithmetic.mixed_operations]
            mastery: [能用字母表示数量关系, 能求代数式的值]
            item_families: [识别, 建模, 计算]
            boss_theme: 字母密室
          - id: math.algebra.equality_properties
            name: 等式性质与代数变形
            stage: g6-g7
            prerequisites: [math.algebra.letters_expressions]
            mastery: [能说明等式两边同加同减, 能完成基本移项]
            item_families: [判断, 计算, 应用]
            boss_theme: 天平核心
          - id: math.algebra.linear_equation_one_var
            name: 一元一次方程
            stage: g7
            prerequisites: [math.algebra.equality_properties]
            mastery: [能解一元一次方程, 能检验方程解]
            item_families: [计算, 应用, 迁移]
            boss_theme: 未知数王座
          - id: math.algebra.equation_modeling
            name: 方程建模与实际问题
            stage: g7-g8
            prerequisites: [math.algebra.linear_equation_one_var]
            mastery: [能设未知数, 能列方程解决实际问题]
            item_families: [建模, 应用, 迁移]
            boss_theme: 情境迷宫
          - id: math.algebra.functions_coordinates
            name: 坐标与一次函数
            stage: g7-g9
            prerequisites: [math.algebra.linear_equation_one_var]
            mastery: [能读坐标, 能理解函数变量关系]
            item_families: [识别, 图象, 应用]
            boss_theme: 坐标星图
      - id: geometry
        name: 几何与测量
        nodes:
          - id: math.geometry.length_area_volume
            name: 长度、面积与体积
            stage: g2-g6
            prerequisites: [math.arithmetic.multiplication_table]
            mastery: [能选择合适单位, 能计算基本面积体积]
            item_families: [计算, 应用, 迁移]
            boss_theme: 尺度神殿
          - id: math.geometry.shapes_relations
            name: 图形性质与位置关系
            stage: g4-g8
            prerequisites: [math.geometry.length_area_volume]
            mastery: [能识别图形性质, 能说明平行垂直关系]
            item_families: [判断, 推理, 应用]
            boss_theme: 几何镜厅
          - id: math.geometry.triangle_circle
            name: 三角形、圆与勾股关系
            stage: g7-g9
            prerequisites: [math.geometry.shapes_relations]
            mastery: [能运用三角形和圆性质, 能解决勾股问题]
            item_families: [计算, 证明, 迁移]
            boss_theme: 圆弧堡垒
          - id: math.geometry.similarity_trigonometry
            name: 相似与锐角三角函数
            stage: g9
            prerequisites: [math.geometry.triangle_circle, math.fractions_decimals.ratio_percent]
            mastery: [能判断相似, 能用三角函数求边角]
            item_families: [计算, 建模, 应用]
            boss_theme: 影长之门
      - id: data_probability
        name: 统计与概率
        nodes:
          - id: math.data_probability.charts
            name: 数据收集与统计图
            stage: g3-g7
            prerequisites: [math.arithmetic.mixed_operations]
            mastery: [能读统计图, 能选择合适图表]
            item_families: [读取, 判断, 应用]
            boss_theme: 数据棱镜
          - id: math.data_probability.measures
            name: 平均数、中位数与众数
            stage: g5-g8
            prerequisites: [math.data_probability.charts]
            mastery: [能计算集中趋势, 能解释指标差异]
            item_families: [计算, 解释, 应用]
            boss_theme: 均衡密室
          - id: math.data_probability.probability_basics
            name: 随机事件与概率基础
            stage: g6-g9
            prerequisites: [math.fractions_decimals.fraction_operations]
            mastery: [能判断随机事件, 能计算简单概率]
            item_families: [判断, 计算, 应用]
            boss_theme: 机会转盘
      - id: modeling
        name: 建模与应用
        nodes:
          - id: math.modeling.word_problem_models
            name: 应用题模型
            stage: g2-g9
            prerequisites: [math.arithmetic.mixed_operations]
            mastery: [能提取数量关系, 能选择合适运算]
            item_families: [建模, 应用, 迁移]
            boss_theme: 情境枢纽
          - id: math.modeling.multi_step_problems
            name: 多步骤综合问题
            stage: g5-g9
            prerequisites: [math.modeling.word_problem_models, math.algebra.equation_modeling]
            mastery: [能分解复杂问题, 能检验答案合理性]
            item_families: [建模, 推理, 迁移]
            boss_theme: 终局演算

  - id: chinese
    name: 语文
    domains:
      - id: phonetics
        name: 语音与拼音
        nodes:
          - id: chinese.phonetics.pinyin_syllable
            name: 拼音、声母韵母与音节
            stage: g1
            prerequisites: []
            mastery: [能拼读音节, 能借助拼音识字]
            item_families: [识别, 拼读, 判断]
            boss_theme: 声音之门
          - id: chinese.phonetics.tone_pronunciation
            name: 声调与朗读节奏
            stage: g1-g3
            prerequisites: [chinese.phonetics.pinyin_syllable]
            mastery: [能正确标调, 能按停顿朗读]
            item_families: [判断, 朗读, 应用]
            boss_theme: 四声阶梯
      - id: characters
        name: 汉字与词汇
        nodes:
          - id: chinese.characters.strokes_radicals
            name: 笔画、偏旁与部首
            stage: g1-g2
            prerequisites: [chinese.phonetics.pinyin_syllable]
            mastery: [能按笔顺书写, 能借部首理解字形]
            item_families: [识别, 判断, 书写]
            boss_theme: 文字工坊
          - id: chinese.characters.character_meaning
            name: 字义与形近字
            stage: g2-g4
            prerequisites: [chinese.characters.strokes_radicals]
            mastery: [能辨析形近字, 能结合语境理解字义]
            item_families: [识别, 判断, 应用]
            boss_theme: 字形迷阵
          - id: chinese.characters.dictionary
            name: 字典与工具书使用
            stage: g2-g4
            prerequisites: [chinese.characters.character_meaning]
            mastery: [能查字典, 能选择义项]
            item_families: [操作, 判断, 应用]
            boss_theme: 检索塔
          - id: chinese.characters.vocabulary_context
            name: 词语理解与语境运用
            stage: g3-g9
            prerequisites: [chinese.characters.character_meaning]
            mastery: [能解释词语, 能根据语境选择词语]
            item_families: [识别, 判断, 应用]
            boss_theme: 词语回廊
      - id: sentences
        name: 句子与表达
        nodes:
          - id: chinese.sentences.structure
            name: 句子结构与病句辨析
            stage: g2-g6
            prerequisites: [chinese.characters.vocabulary_context]
            mastery: [能识别主干, 能修改常见病句]
            item_families: [判断, 修改, 应用]
            boss_theme: 句子矩阵
          - id: chinese.sentences.punctuation
            name: 标点符号与语气表达
            stage: g2-g6
            prerequisites: [chinese.sentences.structure]
            mastery: [能使用常见标点, 能判断语气作用]
            item_families: [判断, 修改, 应用]
            boss_theme: 标点星轨
          - id: chinese.sentences.rhetoric
            name: 修辞与表达效果
            stage: g4-g9
            prerequisites: [chinese.sentences.structure]
            mastery: [能识别比喻拟人排比, 能分析表达效果]
            item_families: [识别, 分析, 应用]
            boss_theme: 修辞幻镜
      - id: reading
        name: 阅读理解
        nodes:
          - id: chinese.reading.information_extraction
            name: 信息提取与概括
            stage: g2-g6
            prerequisites: [chinese.sentences.structure]
            mastery: [能定位关键信息, 能概括段落内容]
            item_families: [提取, 概括, 应用]
            boss_theme: 信息沙盘
          - id: chinese.reading.main_idea
            name: 主旨、结构与写作意图
            stage: g4-g9
            prerequisites: [chinese.reading.information_extraction]
            mastery: [能概括主旨, 能分析段落作用]
            item_families: [概括, 分析, 应用]
            boss_theme: 主旨中枢
          - id: chinese.reading.inference
            name: 推断、评价与人物形象
            stage: g5-g9
            prerequisites: [chinese.reading.main_idea]
            mastery: [能依据文本推断, 能评价人物和观点]
            item_families: [推理, 评价, 迁移]
            boss_theme: 暗线侦测
      - id: classical
        name: 古诗文与传统文化
        nodes:
          - id: chinese.classical.recitation
            name: 古诗文诵读与积累
            stage: g1-g9
            prerequisites: [chinese.phonetics.tone_pronunciation]
            mastery: [能背诵指定篇目, 能理解基本节奏]
            item_families: [识记, 朗读, 应用]
            boss_theme: 诗音回廊
          - id: chinese.classical.translation
            name: 文言实词、虚词与翻译
            stage: g7-g9
            prerequisites: [chinese.classical.recitation, chinese.characters.vocabulary_context]
            mastery: [能解释常见实词虚词, 能翻译句子]
            item_families: [识记, 翻译, 推理]
            boss_theme: 古文石刻
          - id: chinese.classical.culture_context
            name: 文学文化常识与情境理解
            stage: g5-g9
            prerequisites: [chinese.classical.translation]
            mastery: [能联系文化背景理解作品, 能识别常见文学常识]
            item_families: [识记, 分析, 应用]
            boss_theme: 文明长卷
      - id: writing
        name: 写作与表达
        nodes:
          - id: chinese.writing.paragraph
            name: 段落组织与中心句
            stage: g2-g5
            prerequisites: [chinese.sentences.structure]
            mastery: [能围绕中心写段落, 能安排先后顺序]
            item_families: [组织, 修改, 创作]
            boss_theme: 段落工坊
          - id: chinese.writing.narrative
            name: 记叙文写作
            stage: g3-g9
            prerequisites: [chinese.writing.paragraph]
            mastery: [能写清起因经过结果, 能描写细节]
            item_families: [构思, 写作, 修改]
            boss_theme: 叙事剧场
          - id: chinese.writing.expository
            name: 说明文写作
            stage: g5-g9
            prerequisites: [chinese.writing.paragraph]
            mastery: [能选择说明方法, 能按顺序说明事物]
            item_families: [构思, 写作, 修改]
            boss_theme: 说明蓝图
          - id: chinese.writing.argumentative
            name: 议论文写作
            stage: g8-g9
            prerequisites: [chinese.writing.expository]
            mastery: [能提出观点, 能使用论据论证]
            item_families: [构思, 论证, 修改]
            boss_theme: 论点议会

  - id: english
    name: 英语
    domains:
      - id: phonics
        name: 字母与自然拼读
        nodes:
          - id: english.phonics.alphabet
            name: 字母与字母顺序
            stage: g1-g2
            prerequisites: []
            mastery: [能认读字母, 能区分大小写]
            item_families: [识别, 听辨, 判断]
            boss_theme: 字母回廊
          - id: english.phonics.letter_sound
            name: 字母音与自然拼读
            stage: g1-g3
            prerequisites: [english.phonics.alphabet]
            mastery: [能拼读常见字母组合, 能听音写词]
            item_families: [拼读, 听辨, 应用]
            boss_theme: 声音熔炉
      - id: vocabulary
        name: 词汇
        nodes:
          - id: english.vocabulary.core_words
            name: 核心词汇与主题词
            stage: g1-g9
            prerequisites: [english.phonics.letter_sound]
            mastery: [能理解主题词, 能在句子中使用]
            item_families: [识别, 选择, 应用]
            boss_theme: 词库迷宫
          - id: english.vocabulary.word_formation
            name: 构词法与词性变化
            stage: g6-g9
            prerequisites: [english.vocabulary.core_words]
            mastery: [能识别常见词缀, 能判断词性变化]
            item_families: [识别, 判断, 应用]
            boss_theme: 构词齿轮
          - id: english.vocabulary.collocation
            name: 固定搭配与短语
            stage: g4-g9
            prerequisites: [english.vocabulary.core_words]
            mastery: [能识别固定搭配, 能选择正确短语]
            item_families: [识别, 选择, 应用]
            boss_theme: 搭配星桥
      - id: sentence_grammar
        name: 句法与语法
        nodes:
          - id: english.sentence_grammar.basic_patterns
            name: 基本句型与语序
            stage: g3-g6
            prerequisites: [english.vocabulary.core_words]
            mastery: [能识别基本句型, 能排列正确语序]
            item_families: [判断, 排列, 应用]
            boss_theme: 语序矩阵
          - id: english.sentence_grammar.tense_aspect
            name: 时态与体
            stage: g4-g9
            prerequisites: [english.sentence_grammar.basic_patterns]
            mastery: [能区分常用时态, 能根据时间标志选择形式]
            item_families: [选择, 改写, 应用]
            boss_theme: 时间裂隙
          - id: english.sentence_grammar.modals
            name: 情态动词与语气
            stage: g6-g9
            prerequisites: [english.sentence_grammar.tense_aspect]
            mastery: [能理解情态意义, 能表达请求许可能力]
            item_families: [选择, 判断, 应用]
            boss_theme: 语气守卫
          - id: english.sentence_grammar.clauses
            name: 从句与连接
            stage: g7-g9
            prerequisites: [english.sentence_grammar.tense_aspect]
            mastery: [能识别从句类型, 能连接句子]
            item_families: [识别, 改写, 应用]
            boss_theme: 连接枢纽
      - id: skills
        name: 听说读写
        nodes:
          - id: english.skills.listening
            name: 听力理解
            stage: g1-g9
            prerequisites: [english.phonics.letter_sound, english.vocabulary.core_words]
            mastery: [能获取关键信息, 能理解简单对话]
            item_families: [听辨, 提取, 推断]
            boss_theme: 声波暗室
          - id: english.skills.speaking
            name: 口语表达
            stage: g1-g9
            prerequisites: [english.sentence_grammar.basic_patterns]
            mastery: [能完成交际任务, 能进行连贯表达]
            item_families: [问答, 描述, 表达]
            boss_theme: 交流广场
          - id: english.skills.reading
            name: 阅读策略
